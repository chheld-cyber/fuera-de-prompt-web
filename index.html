<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fuera de Prompt</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111111;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      text-align: center;
      padding: 40px;
    }

    h1 {
      margin: 0;
      font-size: clamp(45px, 8vw, 90px);
      letter-spacing: -3px;
    }

    p {
      margin-top: 20px;
      font-size: 20px;
      color: #aaaaaa;
    }

    .status {
      margin-top: 35px;
      font-size: 13px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
  </style>

</head>

<body>

  <main class="container">

    <h1>Fuera de Prompt</h1>

    <p>Estamos construyendo algo diferente.</p>

    <div class="status">
      Próximamente

  </main>

</html>
